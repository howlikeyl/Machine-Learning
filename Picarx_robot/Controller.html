<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiCar-X Controller</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
            background: #0f1115; color: #e6e8ec;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 24px 16px; gap: 20px;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        }

        header { width: 100%; max-width: 720px; display: flex; align-items: center; justify-content: space-between; }
        h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
        .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8b93a1; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }

        .video-frame {
            width: 100%; max-width: 720px; background: #000;
            border: 1px solid #232733; border-radius: 14px; overflow: hidden;
            aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center;
        }
        .video-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .controls { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
        .pad-group { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .pad-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #5b626f; }

        .pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 8px; }

        button {
            border: 1px solid #2a2f3b; background: #1a1e26; color: #e6e8ec;
            font-size: 20px; border-radius: 12px; cursor: pointer;
            transition: background 0.12s, transform 0.08s, border-color 0.12s, opacity 0.12s;
            display: flex; align-items: center; justify-content: center; touch-action: none;
        }
        button:hover { background: #232936; border-color: #3a4254; }
        button:active { transform: scale(0.94); background: #2c3340; }

        .up { grid-column: 2; grid-row: 1; }
        .leftb { grid-column: 1; grid-row: 2; }
        .mid { grid-column: 2; grid-row: 2; }
        .rightb { grid-column: 3; grid-row: 2; }
        .down { grid-column: 2; grid-row: 3; }

        .stop { font-size: 12px; font-weight: 600; background: #2a1416; border-color: #5b2a2f; color: #ff8a8a; }
        .stop:hover { background: #3a1a1e; }
        .cam-mid { color: #5b626f; font-size: 11px; }

        /* disabled look for the up arrow while reversing */
        button.disabled { opacity: 0.3; cursor: not-allowed; }

        .reverse-toggle {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 16px; border-radius: 999px;
            border: 1px solid #2a2f3b; background: #1a1e26;
            cursor: pointer; font-size: 14px; color: #e6e8ec;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        .reverse-toggle.on { background: #3a2410; border-color: #a6701e; color: #ffc169; }
        .reverse-toggle .pip {
            width: 10px; height: 10px; border-radius: 50%;
            background: #5b626f; transition: background 0.15s, box-shadow 0.15s;
        }
        .reverse-toggle.on .pip { background: #ffc169; box-shadow: 0 0 8px #ffc169; }

        footer { font-size: 12px; color: #5b626f; margin-top: 4px; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1>PiCar-X</h1>
        <div class="status"><span class="dot"></span> Live</div>
    </header>

    <div class="video-frame">
        <img src="/video" alt="Live camera feed">
    </div>

    <div class="reverse-toggle" id="reverseToggle">
        <span class="pip"></span>
        <span id="reverseLabel">Reverse: Off</span>
    </div>

    <div class="controls">
        <div class="pad-group">
            <div class="pad-label">Drive</div>
            <div class="pad">
                <button class="up"   data-role="up">&#9650;</button>
                <button class="leftb" data-role="left">&#9664;</button>
                <button class="mid stop" data-role="stop">STOP</button>
                <button class="rightb" data-role="right">&#9654;</button>
                <button class="down" data-role="down">&#9660;</button>
            </div>
        </div>

        <div class="pad-group">
            <div class="pad-label">Camera</div>
            <div class="pad">
                <button class="up"   data-cam="up">&#9650;</button>
                <button class="leftb" data-cam="left">&#9664;</button>
                <button class="mid cam-mid">&#9678;</button>
                <button class="rightb" data-cam="right">&#9654;</button>
                <button class="down" data-cam="down">&#9660;</button>
            </div>
        </div>
    </div>

    <footer>Hold to drive or pan &middot; release to stop</footer>

    <script>
        function send(path) {
            fetch('/' + path);
        }

        // ----- reverse state -----
        var reverse = false;
        var toggle = document.getElementById('reverseToggle');
        var label = document.getElementById('reverseLabel');
        var upBtn = document.querySelector('button[data-role="up"]');

        toggle.addEventListener('click', function () {
            reverse = !reverse;                      // flip state
            toggle.classList.toggle('on', reverse);
            label.textContent = reverse ? 'Reverse: On' : 'Reverse: Off';
            upBtn.classList.toggle('disabled', reverse);  // grey out up arrow
        });

        // Given a button role, return the move command for the current mode.
        // Returns null if the button should do nothing.
        function commandFor(role) {
            if (reverse) {
                if (role === 'up')    return null;             // up disabled in reverse
                if (role === 'left')  return 'backward_left';
                if (role === 'right') return 'backward_right';
                if (role === 'down')  return 'backward';
            } else {
                if (role === 'up')    return 'forward';
                if (role === 'left')  return 'left';
                if (role === 'right') return 'right';
                if (role === 'down')  return 'backward';
            }
            return null;
        }

        // ----- drive buttons (press and hold) -----
        document.querySelectorAll('button[data-role]').forEach(function (btn) {
            var role = btn.dataset.role;

            if (role === 'stop') {
                btn.addEventListener('click', function () { send('move/stop'); });
                return;
            }

            function start(e) {
                e.preventDefault();
                var cmd = commandFor(role);
                if (cmd === null) return;            // disabled (e.g. up in reverse)
                send('move/' + cmd);
            }
            function stop(e) {
                e.preventDefault();
                send('move/stop');
            }

            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', stop);
            btn.addEventListener('mouseleave', stop);
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', stop);
            btn.addEventListener('touchcancel', stop);
        });

        // ----- camera buttons (hold to keep panning) -----
        document.querySelectorAll('button[data-cam]').forEach(function (btn) {
            var dir = btn.dataset.cam;
            var timer = null;

            function start(e) {
                e.preventDefault();
                if (timer) return;
                send('camera/' + dir);
                timer = setInterval(function () { send('camera/' + dir); }, 150);
            }
            function stop(e) {
                if (e) e.preventDefault();
                clearInterval(timer);
                timer = null;
            }

            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', stop);
            btn.addEventListener('mouseleave', stop);
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', stop);
            btn.addEventListener('touchcancel', stop);
        });
    </script>
</body>
</html>
